<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project-ecommerce</title>
    <!-- Link icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Link Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- other link -->
    <!-- Style.css link -->

    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="all-in">
        <header>
            <a href="index.html" class="logo">MasterIT store</a>
            <nav class="main-nav">
                <!-- menu link -------------------------------------------------------- //////////////////////-->
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="product.html">Products</a></li>
                    <li><a href="About-Us.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <!-- nav-icon ---------------------------------------------------------//////////////////////---->
                <ul class="nav-icon">
                    <li><a href="bag.html" class="cart"><i class="fa-solid fa-bag-shopping"></i></a></li>
                    <li><a href="#" class="bar" id="menuBtn"><i class="fa-solid fa-bars"></i></a></li>
                </ul>
            </nav>
        </header>
    </div>
    <section>
        <div class="contact1">
            <h1>Contact Us</h1>
            <div class="card-contact">
                <form class="in-card" action="#">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>

                    <label for="message">Your message</label>
                    <textarea id="message" name="message" placeholder="Typ your message here" required></textarea>

                    <button type="submit" class="message">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        const menuBtn = document.getElementById("menuBtn");
        const navLinks = document.getElementById("navLinks");

        menuBtn.addEventListener("click", (e) => {
            e.preventDefault();
            navLinks.classList.toggle("show");
        });
    </script>
</body>

</html>
